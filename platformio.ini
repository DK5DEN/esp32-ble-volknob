[env:esp32-c3-supermini]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = huge_app.csv

; Der C3 Super Mini meldet sich ueber USB-Serial-JTAG (VID 303A / PID 1001).
; Ohne Angabe sucht PlatformIO den Port selbst; bei mehreren Boards hier
; festnageln, z. B. upload_port = COM3 bzw. /dev/ttyACM0.
; upload_port = COM3
; monitor_port = COM3
monitor_speed = 115200

build_flags =
    -DUSE_NIMBLE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    https://github.com/T-vK/ESP32-BLE-Keyboard.git
    h2zero/NimBLE-Arduino@^1.4.1
